[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finance360-ai"
version = "0.1.0"
description = "Enterprise Credit Risk Intelligence and Predictive Analytics Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<25",
    "scipy>=1.14,<2.0",
    "statsmodels>=0.14,<1.0",
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1,<4.0",
    "shap>=0.46,<1.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.24,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "streamlit>=1.39,<2.0",
    "joblib>=1.4,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.7,<1.0",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
